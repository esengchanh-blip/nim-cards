<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#9B7BB8">
<title>Nim Thaï — Cartes</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Raleway:wght@300;400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{scope:'.'}).then(reg=>{
  setInterval(()=>reg.update(),30*60*1000);reg.addEventListener('updatefound',()=>{const nw=reg.installing;
  nw.addEventListener('statechange',()=>{if(nw.state==='activated'&&navigator.serviceWorker.controller)window.location.reload()})})});
  let r=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!r){r=true;window.location.reload()}})}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Raleway',sans-serif;min-height:100dvh;
  background:linear-gradient(135deg,#8668A4,#9B7BB8 50%,#B89FCC);
  color:#fff;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
input,select,button{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import{h,render}from'https://esm.sh/preact@10.24.3';
import{useState,useEffect,useRef}from'https://esm.sh/preact@10.24.3/hooks';
import htm from'https://esm.sh/htm@3.1.1';
const html=htm.bind(h);

const C={mauve:'#9B7BB8',mauveDark:'#8668A4',mauveLight:'#B89FCC',gold:'#D4AF37',goldDark:'#C9A63D',
  red:'#C0392B',white:'#FFFFFF',cream:'#FFF8E7',creamDark:'#F0E6D0',magenta:'#B6007D'};
const SOINS=["Massage thaï traditionnel — 60 min","Massage thaï traditionnel — 90 min",
  "Réflexologie plantaire — 60 min","Massage dos — 30 min","Massage pieds — 30 min",
  "Rituel Sérénité","Rituel Évasion","Rituel Harmonie",
  "Carnet Découverte (3 séances)","Carnet Fidèle (5 séances)","Pass Signature (10 séances)","Pass Duo Sérénité"];
const genId=p=>p+'-'+Math.random().toString(36).substring(2,6).toUpperCase();
const addMonths=(d,n)=>{const x=new Date(d);x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};
const fmtDate=d=>d?d.split('-').reverse().join(' / '):'';
const phoneClean=p=>(p||'').replace(/[\s.\-]/g,'');
const LS_KEY='nim-items-v3';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'[]')}catch{return[]}}
function lsSave(d){localStorage.setItem(LS_KEY,JSON.stringify(d))}
async function scanQR(file){try{const bm=await createImageBitmap(file);
  if('BarcodeDetector' in window){const d=new BarcodeDetector({formats:['qr_code']});
  const r=await d.detect(bm);if(r.length>0)return r[0].rawValue}}catch{}return null}
function loadH2C(){return new Promise((ok,no)=>{if(window.html2canvas){ok(window.html2canvas);return}
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=()=>ok(window.html2canvas);s.onerror=no;document.head.appendChild(s)})}
function QR({data,size=50}){const[ok,setOk]=useState(true);
  const url='https://api.qrserver.com/v1/create-qr-code/?size='+size*2+'x'+size*2+'&data='+encodeURIComponent(data)+'&margin=3&format=png';
  if(!ok)return html`<div style=${{width:size,height:size,background:'#fff',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'monospace',fontSize:8,color:'#333'}}>${data}</div>`;
  return html`<img src=${url} width=${size} height=${size} crossorigin="anonymous" style=${{borderRadius:4,background:'#fff',padding:2}} onError=${()=>setOk(false)}/>`;
}

function App(){
  const[screen,setScreen]=useState('home');
  const[items,setItems]=useState([]);
  const[current,setCurrent]=useState(null);
  const[loading,setLoading]=useState(true);
  const[sharing,setSharing]=useState(false);
  const[search,setSearch]=useState('');
  const[scanMsg,setScanMsg]=useState('');
  const[clientPhone,setClientPhone]=useState('');
  const[clientName,setClientName]=useState('');
  const[foundClient,setFoundClient]=useState(null);
  const[dur,setDur]=useState('1h');
  const[cPour,setCPour]=useState('');
  const[cDeLaPart,setCDeLaPart]=useState('');
  const[cSoin,setCSoin]=useState(SOINS[0]);
  const cardRef=useRef(null);const scanRef=useRef(null);const importRef=useRef(null);

  useEffect(()=>{setItems(lsLoad());setLoading(false)},[]);
  const save=async a=>{setItems(a);lsSave(a)};
  const findByPhone=p=>{const cl=phoneClean(p);if(cl.length<4)return null;
    const f=items.find(i=>phoneClean(i.phone)===cl||phoneClean(i.phone).endsWith(cl));
    return f?{name:f.name,phone:f.phone}:null};
  const createAbo=async()=>{const item={type:'abo',id:genId('NIM'),name:clientName,phone:phoneClean(clientPhone),
    duration:dur,visits:[false,false,false,false,false],dates:[null,null,null,null,null],created:new Date().toISOString()};
    await save([item,...items]);setCurrent(item);setScreen('view-abo')};
  const createCadeau=async()=>{const now=new Date().toISOString();
    const item={type:'cadeau',id:genId('CDO'),name:clientName,phone:phoneClean(clientPhone),
    pour:cPour,deLaPart:cDeLaPart,soin:cSoin,validUntil:addMonths(now,6),created:now,used:false,usedDate:null};
    await save([item,...items]);setCurrent(item);setScreen('view-cadeau')};
  const toggleVisit=async i=>{const u=items.map(c=>{if(c.id!==current.id)return c;
    const v=[...c.visits],d=[...(c.dates||[null,null,null,null,null])];v[i]=!v[i];d[i]=v[i]?new Date().toISOString().slice(0,10):null;
    return{...c,visits:v,dates:d}});await save(u);setCurrent(u.find(c=>c.id===current.id))};
  const toggleUsed=async()=>{const u=items.map(c=>c.id!==current.id?c:
    {...c,used:!c.used,usedDate:!c.used?new Date().toISOString().slice(0,10):null});
    await save(u);setCurrent(u.find(c=>c.id===current.id))};
  const deleteItem=async id=>{await save(items.filter(c=>c.id!==id));setScreen('home')};
  const openItem=item=>{setCurrent(item);setScreen(item.type==='abo'?'view-abo':'view-cadeau')};
  const shareCard=async()=>{if(!cardRef.current)return;setSharing(true);
    try{const h2c=await loadH2C();const cv=await h2c(cardRef.current,{backgroundColor:null,scale:2,useCORS:true,logging:false});
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const file=new File([blob],current.id+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:current.id});
    else{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=file.name;a.click();URL.revokeObjectURL(u)}}
    catch(e){if(e.name!=='AbortError')alert('Erreur: '+e.message)}setSharing(false)};
  const handleScan=async e=>{const file=e.target.files?.[0];if(!file)return;setScanMsg('Analyse…');
    const result=await scanQR(file);if(result){const found=items.find(c=>c.id===result);
    if(found){setScanMsg('');if(found.type==='cadeau'&&!found.used){const today=new Date().toISOString().slice(0,10);
      const u=items.map(c=>c.id===found.id?{...c,used:true,usedDate:today}:c);await save(u);
      setCurrent(u.find(c=>c.id===found.id));setScreen('view-cadeau')}else{openItem(found)}e.target.value='';return}
    setScanMsg('"'+result+'" — non trouvé')}else{setScanMsg('QR non détecté')}e.target.value='';setTimeout(()=>setScanMsg(''),3500)};
  const stampCount=c=>c.visits.filter(Boolean).length;
  const isComplete=c=>c.type==='abo'&&stampCount(c)===5;
  const isExpired=c=>c.type==='cadeau'&&c.validUntil<new Date().toISOString().slice(0,10);
  const startNew=()=>{setClientPhone('');setClientName('');setFoundClient(null);setDur('1h');setCPour('');setCDeLaPart('');setCSoin(SOINS[0]);setScreen('identify')};
  const filtered=search?items.filter(i=>(i.name||'').toLowerCase().includes(search.toLowerCase())||i.id.toLowerCase().includes(search.toLowerCase())||phoneClean(i.phone).includes(phoneClean(search))||(i.pour||'').toLowerCase().includes(search.toLowerCase())):items;

  const sBtn={width:'100%',padding:'14px',borderRadius:12,border:'none',background:'linear-gradient(135deg,'+C.gold+','+C.goldDark+')',color:'#1a0a2e',fontSize:15,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8};
  const sInput={width:'100%',padding:'12px 14px',borderRadius:10,border:'2px solid '+C.gold+'50',background:C.white+'10',color:C.white,fontSize:17,outline:'none',boxSizing:'border-box',textAlign:'center'};
  const navBar=html`<div style=${{padding:'10px 16px 6px',display:'flex',justifyContent:'space-between'}}>
    <button onClick=${()=>setScreen('home')} style=${{background:'rgba(0,0,0,0.3)',border:'none',color:'#fff',fontSize:13,cursor:'pointer',padding:'6px 14px',borderRadius:8}}>← Accueil</button>
    <button onClick=${()=>{if(confirm('Supprimer ?'))deleteItem(current.id)}} style=${{background:'rgba(192,57,43,0.3)',border:'none',color:'#fcc',fontSize:12,cursor:'pointer',padding:'6px 12px',borderRadius:8}}>Supprimer</button></div>`;

  // ═══ HOME ═══
  if(screen==='home'){return html`<div>
    <div style=${{padding:'28px 20px 12px',textAlign:'center'}}><div style=${{fontFamily:"'Dancing Script',cursive",fontSize:32,fontWeight:700,color:C.gold}}>Nim Thaï</div>
      <div style=${{fontSize:10,letterSpacing:4,textTransform:'uppercase',color:C.creamDark,marginTop:2}}>Gestion clients</div></div>
    <div style=${{padding:'0 20px 10px'}}><input value=${search} onInput=${e=>setSearch(e.target.value)} placeholder="Nom, téléphone ou ID…" style=${{...sInput,fontSize:14,border:'1px solid '+C.gold+'30'}}/></div>
    <div style=${{padding:'0 20px 14px',display:'flex',gap:10}}>
      <button onClick=${startNew} style=${{...sBtn,flex:1}}>+ Nouveau</button>
      <button onClick=${()=>scanRef.current?.click()} style=${{padding:'14px 18px',borderRadius:12,background:C.white+'15',border:'1px solid '+C.gold+'50',color:C.gold,fontSize:20,cursor:'pointer'}}>📷</button>
      <input ref=${scanRef} type="file" accept="image/*" capture="environment" onChange=${handleScan} style=${{display:'none'}}/></div>
    ${scanMsg&&html`<div style=${{padding:'0 20px 10px'}}><div style=${{padding:10,borderRadius:10,background:C.white+'12',fontSize:13,color:C.cream,textAlign:'center'}}>${scanMsg}</div></div>`}
    ${loading?html`<div style=${{textAlign:'center',padding:40,color:C.creamDark}}>Chargement…</div>`:html`<div style=${{padding:'0 20px'}}>
      ${filtered.length===0&&html`<div style=${{textAlign:'center',padding:30,color:C.creamDark,fontSize:14}}>${search?'Aucun résultat':'Aucun client'}</div>`}
      ${filtered.map(item=>html`<div key=${item.id} onClick=${()=>openItem(item)} style=${{background:C.white+'10',borderRadius:14,padding:'12px 14px',marginBottom:8,cursor:'pointer',border:'1px solid '+C.gold+'25',opacity:(item.used||isComplete(item))?0.55:1,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style=${{minWidth:0}}><div style=${{fontSize:15,fontWeight:600,display:'flex',alignItems:'center',gap:8}}>
          <span style=${{fontSize:11,padding:'2px 7px',borderRadius:6,background:item.type==='abo'?C.gold+'30':C.magenta+'30',color:item.type==='abo'?C.gold:C.magenta}}>${item.type==='abo'?'ABO':'CADEAU'}</span>
          ${item.type==='cadeau'?item.pour:item.name}</div><div style=${{fontSize:11,color:C.creamDark,marginTop:3}}>${item.id} · ${item.phone}</div></div>
        ${item.type==='abo'?html`<div style=${{display:'flex',gap:3,flexShrink:0}}>${item.visits.map(v=>html`<div style=${{width:12,height:12,borderRadius:'50%',border:'2px solid '+C.gold,background:v?C.gold:'transparent'}}/>`)}</div>`
        :html`<div style=${{fontSize:11,flexShrink:0,fontWeight:600,color:item.used?'#4CAF50':isExpired(item)?C.red:C.creamDark}}>${item.used?'✓ Utilisé':isExpired(item)?'Expiré':'→ '+fmtDate(item.validUntil)}</div>`}
      </div>`)}
    </div>`}
    ${items.length>0&&html`<div style=${{padding:'16px 20px 0',display:'flex',gap:8}}>
      <button onClick=${()=>{const b=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='nim-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u)}}
        style=${{flex:1,padding:'10px',borderRadius:10,background:C.white+'10',border:'1px solid '+C.gold+'25',color:C.creamDark,fontSize:12,cursor:'pointer'}}>💾 Exporter</button>
      <button onClick=${()=>importRef.current?.click()} style=${{flex:1,padding:'10px',borderRadius:10,background:C.white+'10',border:'1px solid '+C.gold+'25',color:C.creamDark,fontSize:12,cursor:'pointer'}}>📂 Importer</button>
      <input ref=${importRef} type="file" accept=".json" onChange=${async e=>{const f=e.target.files?.[0];if(!f)return;try{const t=await f.text();const d=JSON.parse(t);if(Array.isArray(d)){await save(d);alert('✅ '+d.length+' cartes restaurées')}else{alert('Invalide')}}catch{alert('Erreur')}e.target.value=''}} style=${{display:'none'}}/></div>`}
    <div style=${{height:40}}/></div>`}

  // ═══ IDENTIFY ═══
  if(screen==='identify'){const hp=v=>{setClientPhone(v);const f=findByPhone(v);setFoundClient(f);if(f)setClientName(f.name)};
    const ok=phoneClean(clientPhone).length>=6&&clientName.trim().length>=2;
    return html`<div>
      <div style=${{padding:'20px'}}><button onClick=${()=>setScreen('home')} style=${{background:'rgba(0,0,0,0.3)',border:'none',color:'#fff',fontSize:13,cursor:'pointer',padding:'6px 14px',borderRadius:8}}>← Retour</button></div>
      <div style=${{padding:'0 24px',textAlign:'center'}}>
        <div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:C.gold,fontWeight:600,marginBottom:24}}>Identification client</div>
        <div style=${{marginBottom:18}}><label style=${{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.creamDark,display:'block',marginBottom:6}}>Téléphone</label>
          <input value=${clientPhone} onInput=${e=>hp(e.target.value)} placeholder="06 12 34 56 78" type="tel" autofocus style=${{...sInput,letterSpacing:2}}/></div>
        ${foundClient&&html`<div style=${{padding:'10px 14px',borderRadius:10,background:C.gold+'15',border:'1px solid '+C.gold+'30',marginBottom:16,fontSize:14,color:C.gold}}>Client existant : <strong>${foundClient.name}</strong></div>`}
        ${!foundClient&&phoneClean(clientPhone).length>=6&&html`<div style=${{marginBottom:18}}><label style=${{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.creamDark,display:'block',marginBottom:6}}>Nom</label>
          <input value=${clientName} onInput=${e=>setClientName(e.target.value)} placeholder="Marie Dupont" style=${{...sInput,fontFamily:"'Cormorant Garamond',serif"}}/></div>`}
        <button onClick=${()=>setScreen('choose')} disabled=${!ok} style=${{...sBtn,background:ok?sBtn.background:C.gold+'30',color:ok?'#1a0a2e':C.creamDark}}>Continuer →</button></div></div>`}

  // ═══ CHOOSE ═══
  if(screen==='choose'){return html`<div>
    <div style=${{padding:'20px'}}><button onClick=${()=>setScreen('identify')} style=${{background:'rgba(0,0,0,0.3)',border:'none',color:'#fff',fontSize:13,cursor:'pointer',padding:'6px 14px',borderRadius:8}}>← Retour</button></div>
    <div style=${{padding:'0 24px',textAlign:'center'}}>
      <div style=${{fontSize:13,color:C.creamDark,marginBottom:6}}>${clientName} · ${clientPhone}</div>
      <div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:C.gold,fontWeight:600,marginBottom:28}}>Quel support ?</div>
      <button onClick=${()=>setScreen('create-abo')} style=${{width:'100%',padding:'24px 16px',borderRadius:16,marginBottom:14,background:C.white+'10',border:'2px solid '+C.gold+'50',cursor:'pointer',textAlign:'center',color:C.white}}>
        <div style=${{fontSize:28,marginBottom:6}}>🪷</div><div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:600,color:C.gold}}>Carte d'abonnement</div></button>
      <button onClick=${()=>{setCPour(clientName);setScreen('create-cadeau')}} style=${{width:'100%',padding:'24px 16px',borderRadius:16,background:C.white+'10',border:'2px solid '+C.magenta+'50',cursor:'pointer',textAlign:'center',color:C.white}}>
        <div style=${{fontSize:28,marginBottom:6}}>🎁</div><div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:20,fontWeight:600,color:C.magenta}}>Chèque cadeau</div></button></div></div>`}

  // ═══ CREATE ABO ═══
  if(screen==='create-abo'){return html`<div>
    <div style=${{padding:'20px'}}><button onClick=${()=>setScreen('choose')} style=${{background:'rgba(0,0,0,0.3)',border:'none',color:'#fff',fontSize:13,cursor:'pointer',padding:'6px 14px',borderRadius:8}}>← Retour</button></div>
    <div style=${{padding:'0 24px',textAlign:'center'}}>
      <div style=${{fontSize:13,color:C.creamDark,marginBottom:6}}>${clientName}</div>
      <div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:C.gold,fontWeight:600,marginBottom:24}}>Carte d'abonnement</div>
      <div style=${{display:'flex',gap:12,justifyContent:'center',marginBottom:28}}>
        ${['1h','1h30'].map(d=>html`<button onClick=${()=>setDur(d)} style=${{flex:1,maxWidth:130,padding:'16px 0',borderRadius:12,border:'2px solid '+C.gold,cursor:'pointer',fontSize:22,fontWeight:600,fontFamily:"'Cormorant Garamond',serif",background:dur===d?C.gold:'transparent',color:dur===d?'#1a0a2e':C.gold}}>${d}</button>`)}</div>
      <button onClick=${createAbo} style=${sBtn}>Créer la carte</button></div></div>`}

  // ═══ CREATE CADEAU ═══
  if(screen==='create-cadeau'){const vd=addMonths(new Date().toISOString(),6);return html`<div>
    <div style=${{padding:'20px'}}><button onClick=${()=>setScreen('choose')} style=${{background:'rgba(0,0,0,0.3)',border:'none',color:'#fff',fontSize:13,cursor:'pointer',padding:'6px 14px',borderRadius:8}}>← Retour</button></div>
    <div style=${{padding:'0 24px'}}>
      <div style=${{textAlign:'center',fontFamily:"'Cormorant Garamond',serif",fontSize:24,color:C.magenta,fontWeight:600,marginBottom:20}}>Chèque cadeau</div>
      ${[{l:'Pour',v:cPour,s:setCPour,p:'Mme Dupont'},{l:'De la part de',v:cDeLaPart,s:setCDeLaPart,p:'Sa famille…'}].map(f=>html`
        <div style=${{marginBottom:18}}><label style=${{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.creamDark,display:'block',marginBottom:6}}>${f.l}</label>
          <input value=${f.v} onInput=${e=>f.s(e.target.value)} placeholder=${f.p} style=${{...sInput,fontFamily:"'Cormorant Garamond',serif"}}/></div>`)}
      <div style=${{marginBottom:18}}><label style=${{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.creamDark,display:'block',marginBottom:6}}>Soin offert</label>
        <select value=${cSoin} onChange=${e=>setCSoin(e.target.value)} style=${{...sInput,border:'2px solid '+C.magenta+'50',fontSize:15,fontFamily:"'Cormorant Garamond',serif",WebkitAppearance:'none'}}>
          ${SOINS.map(s=>html`<option value=${s} style=${{background:C.mauveDark,color:C.white}}>${s}</option>`)}</select></div>
      <div style=${{padding:'12px',borderRadius:10,background:C.white+'08',marginBottom:20,textAlign:'center'}}>
        <span style=${{fontSize:11,letterSpacing:2,textTransform:'uppercase',color:C.creamDark}}>Jusqu'au </span>
        <span style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:18,fontWeight:600,color:C.gold}}>${fmtDate(vd)}</span></div>
      <button onClick=${createCadeau} disabled=${!cPour.trim()||!cDeLaPart.trim()}
        style=${{...sBtn,background:cPour.trim()&&cDeLaPart.trim()?'linear-gradient(135deg,'+C.magenta+','+C.red+')':C.gold+'30',color:cPour.trim()&&cDeLaPart.trim()?C.white:C.creamDark}}>Créer</button></div></div>`}

  // ═══════════════════════════════════════
  // VIEW ABO — image vierge + overlays
  // ═══════════════════════════════════════
  if(screen==='view-abo'&&current){const complete=isComplete(current);
    return html`<div>
      ${navBar}
      <div style=${{padding:'0 6px 12px',maxWidth:700,margin:'0 auto'}}>
        <div ref=${cardRef} style=${{position:'relative',borderRadius:8,overflow:'hidden',boxShadow:'0 4px 20px rgba(0,0,0,0.3)'}}>
          <img src="bg-abo.jpg" style=${{width:'100%',display:'block'}} crossorigin="anonymous"/>
          <!-- 5 stamp overlays -->
          ${[0,1,2,3,4].map(i=>html`<div onClick=${()=>toggleVisit(i)}
            style=${{position:'absolute',top:'28%',left:(41.5+i*10.2)+'%',width:'8.5%',paddingBottom:'8.5%',
              borderRadius:'50%',cursor:'pointer',
              background:current.visits[i]?'rgba(212,175,55,0.75)':'transparent',
              display:'flex',alignItems:'center',justifyContent:'center'}}>
            ${current.visits[i]?html`<div style=${{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',color:'#fff',fontSize:'clamp(16px,3vw,28px)',fontWeight:700}}>✓</div>`:''}</div>`)}
          <!-- Duration dot -->
          <div style=${{position:'absolute',top:'50.5%',left:current.duration==='1h'?'60.5%':'71.5%',
            width:'clamp(12px,2.5vw,18px)',height:'clamp(12px,2.5vw,18px)',borderRadius:'50%',background:C.red}}></div>
          <!-- Name -->
          <div style=${{position:'absolute',bottom:'2.5%',left:'52%',right:'5%',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(14px,3vw,24px)',
            fontStyle:'italic',fontWeight:600,color:'#4a2866'}}>${current.name}</div>
          <!-- QR code -->
          <div style=${{position:'absolute',bottom:'18%',left:'3%'}}><${QR} data=${current.id} size=${45}/></div>
          <!-- ID -->
          <div style=${{position:'absolute',bottom:'3%',left:'3%',fontFamily:'monospace',fontSize:'clamp(8px,1.5vw,12px)',color:C.gold+'cc'}}>${current.id}</div>
          <!-- Complete badge -->
          ${complete?html`<div style=${{position:'absolute',top:'42%',left:'58%',transform:'rotate(-15deg)',
            padding:'8px 20px',border:'3px solid '+C.gold,borderRadius:10,background:'rgba(212,175,55,0.92)',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(12px,2.5vw,18px)',fontWeight:700,color:'#1a0a2e',
            whiteSpace:'nowrap',zIndex:5}}>✦ 1 SÉANCE OFFERTE ✦</div>`:''}</div></div>
      <div style=${{padding:'6px 18px 8px',textAlign:'center',fontSize:12,color:C.creamDark}}>${stampCount(current)}/5 · ${current.duration} · ${current.id}</div>
      <div style=${{padding:'0 18px 20px',maxWidth:700,margin:'0 auto'}}><button onClick=${shareCard} disabled=${sharing} style=${{...sBtn,background:sharing?C.gold+'50':sBtn.background}}>${sharing?'⏳ Préparation…':'📤 Partager la carte'}</button></div>
    </div>`}

  // ═══════════════════════════════════════
  // VIEW CADEAU — image vierge + overlays
  // ═══════════════════════════════════════
  if(screen==='view-cadeau'&&current){const expired=isExpired(current);
    return html`<div>
      ${navBar}
      <div style=${{padding:'0 6px 12px',maxWidth:700,margin:'0 auto'}}>
        <div ref=${cardRef} style=${{position:'relative',borderRadius:8,overflow:'hidden',boxShadow:'0 4px 20px rgba(0,0,0,0.3)'}}>
          <img src="bg-cadeau.jpg" style=${{width:'100%',display:'block'}} crossorigin="anonymous"/>
          <!-- POUR -->
          <div style=${{position:'absolute',top:'18%',left:'46%',right:'4%',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(13px,3.5vw,26px)',
            fontStyle:'italic',fontWeight:600,color:C.red}}>${current.pour}</div>
          <!-- DE LA PART DE -->
          <div style=${{position:'absolute',top:'34%',left:'54%',right:'4%',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(13px,3.5vw,26px)',
            fontStyle:'italic',fontWeight:600,color:C.red}}>${current.deLaPart}</div>
          <!-- VALEUR -->
          <div style=${{position:'absolute',top:'49%',left:'42%',right:'3%',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(12px,3vw,22px)',
            fontStyle:'italic',fontWeight:600,color:C.red}}>${current.soin}</div>
          <!-- JUSQU'AU -->
          <div style=${{position:'absolute',top:'64%',left:'48%',right:'8%',
            fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(13px,3.5vw,26px)',
            fontStyle:'italic',fontWeight:600,color:C.red}}>${fmtDate(current.validUntil)}</div>
          <!-- QR -->
          <div style=${{position:'absolute',bottom:'20%',right:'3%'}}><${QR} data=${current.id} size=${38}/></div>
          <div style=${{position:'absolute',bottom:'20%',right:'14%',fontFamily:'monospace',fontSize:'clamp(7px,1.2vw,10px)',color:C.goldDark+'cc'}}>${current.id}</div>
          <!-- SOIN REALISE stamp -->
          ${current.used?html`<div style=${{position:'absolute',top:'38%',left:'55%',transform:'translate(-50%,-50%) rotate(-12deg)',
            padding:'10px 20px',border:'4px solid #2E7D32',borderRadius:12,background:'rgba(232,245,233,0.93)',textAlign:'center',zIndex:5}}>
            <div style=${{fontSize:'clamp(10px,2vw,14px)',letterSpacing:3,textTransform:'uppercase',color:'#2E7D32',fontWeight:700}}>✓ SOIN RÉALISÉ</div>
            <div style=${{fontFamily:"'Cormorant Garamond',serif",fontSize:'clamp(14px,3vw,22px)',fontWeight:600,color:'#2E7D32'}}>le ${fmtDate(current.usedDate)}</div></div>`:''}</div></div>
      <div style=${{padding:'0 18px 6px',textAlign:'center',maxWidth:700,margin:'0 auto'}}>
        ${current.used?html`<div style=${{fontSize:13,color:'#4CAF50',fontWeight:600,marginBottom:8}}>Soin réalisé — repartager ↓</div>`:''}</div>
      <div style=${{padding:'0 18px 10px',display:'flex',gap:10,maxWidth:700,margin:'0 auto'}}>
        <button onClick=${shareCard} disabled=${sharing} style=${{...sBtn,flex:1}}>${sharing?'⏳':current.used?'📤 Renvoyer':'📤 Partager'}</button>
        ${!current.used?html`<button onClick=${toggleUsed} style=${{padding:'14px 18px',borderRadius:12,cursor:'pointer',fontSize:13,fontWeight:600,border:'none',background:C.gold+'25',color:C.gold}}>Valider soin</button>`:''}</div>
    </div>`}

  return html`<div/>`;
}
render(html`<${App}/>`,document.getElementById('app'));
</script>
</body>
</html>
